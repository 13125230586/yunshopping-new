server:
  port: 8101
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

spring:
  application:
    name: yunshopping-backend
  profiles:
    active: local
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yunshopping?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: hcc153502
  # Redis配置
  redis:
    database: 1
    host: 127.0.0.1
    port: 6379
    timeout: 5000
  # session 配置
  session:
    store-type: redis
    timeout: 2592000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

knife4j:
  enable: true
  openapi:
    title: 云商城系统接口文档
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.yunshen.yunshoppingbackend.controller

cos:
  client:
    host: ${COS_HOST:}
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET:}

alipay:
  appId: ${ALIPAY_APP_ID:}
  privateKey: ${ALIPAY_PRIVATE_KEY:}
  publicKey: ${ALIPAY_PUBLIC_KEY:}
  gatewayUrl: https://openapi.alipay.com/gateway.do
  notifyUrl: ${ALIPAY_NOTIFY_URL:}
  returnUrl: ${ALIPAY_RETURN_URL:}

wxpay:
  appId: ${WXPAY_APP_ID:}
  mchId: ${WXPAY_MCH_ID:}
  apiV3Key: ${WXPAY_API_V3_KEY:}
  privateKeyPath: ${WXPAY_PRIVATE_KEY_PATH:}
  merchantSerialNumber: ${WXPAY_MERCHANT_SERIAL_NUMBER:}
  notifyUrl: ${WXPAY_NOTIFY_URL:}